<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Recuperar acesso | Gráfica Peregrina</title>
    <link rel="stylesheet" href="../css/principal.css">
    <link rel="stylesheet" href="../css/paginas/acesso.css">
    <script type="module" src="../js/recuperar-acesso.js"></script>
      <link rel="stylesheet" href="/css/base/tema.css">
    <script src="/js/tema.js"></script>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <main tabindex="-1" id="conteudo" class="pagina-acesso">
      <h1>Recuperar acesso</h1>
      <p>Use uma nova senha com pelo menos 12 caracteres, incluindo letras e números.</p>
      <form id="recuperar-acesso">
        <label for="nova-senha">Nova senha</label>
        <input id="nova-senha" name="senha" type="password" autocomplete="new-password" minlength="12" required>
        <label for="confirmar-senha">Confirme a nova senha</label>
        <input id="confirmar-senha" name="confirmacao" type="password" autocomplete="new-password" minlength="12" required>
        <button class="botao" type="submit">Salvar nova senha</button>
      </form>
      <p id="estado-recuperacao" role="status"></p>
      <a class="link-texto" href="entrar.html">Entrar no painel</a>
    </main>
  </body>
</html>
